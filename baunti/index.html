<script>
  (function () {
    var root = document.documentElement, el = document.getElementById('ld'), done = false;
    var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    // one full hop (900ms) is the minimum; a returning visit in the same session skips the screen
    var MIN = reduced ? 250 : 950, MAX = 3000, t0 = Date.now();
    try { if (sessionStorage.getItem('baunti-loaded')) root.classList.add('ld-skip'); } catch (e) {}
    try { if (/^en\b/.test(localStorage.getItem('baunti-lang') || '')) document.getElementById('ld-label').textContent = 'Loading Baunti'; } catch (e) {}
    function hide() {
      if (done) return; done = true;
      try { sessionStorage.setItem('baunti-loaded', '1'); } catch (e) {}
      el.classList.add('ld-out');
      setTimeout(function () { el.remove(); }, 500);
    }
    window.__bauntiReady = function () { setTimeout(hide, Math.max(0, MIN - (Date.now() - t0))); };
    setTimeout(hide, MAX);
  })();
</script>
<script>
  // v4: observe the loader hand-off. The app still calls __bauntiReady exactly as before.
  (function () {
    var root = document.documentElement, orig = window.__bauntiReady, ld = document.getElementById('ld');
    function ready() { if (window.__btReady) return; window.__btReady = true; window.dispatchEvent(new Event('baunti:ready')); }
    window.__bauntiReady = function () { ready(); return orig.apply(this, arguments); };
    setTimeout(ready, 3000);
    // when the loader starts fading, the hero's supporting content settles in
    window.__btHandoff = function () {
      if (root.classList.contains('bt-handoff') || !document.getElementById('main')) return;
      root.classList.add('bt-handoff');
      setTimeout(function () { root.classList.remove('bt-handoff'); }, 1400);
    };
    if (ld && !root.classList.contains('ld-skip')) new MutationObserver(function (m, o) {
      if (ld.classList.contains('ld-out')) { o.disconnect(); window.__btHandoff(); }
    }).observe(ld, { attributes: true, attributeFilter: ['class'] });
  })();
</script>
